name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_release:
        description: "Run release job after CI passes"
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# ─── Secrets required ─────────────────────────────────────────────────────────
# CONVEX_DEPLOY_KEY  — Convex deploy key (CI codegen uses the default key;
#                      Vercel uses scoped production/preview keys)
# GITHUB_TOKEN       — Auto-provided by GitHub Actions (release job uses it)
#
# Vercel handles all deployments via Git integration — no Vercel tokens needed
# in this workflow. Team members with repo push/PR access control the full
# CI/CD pipeline without needing Vercel or Convex dashboard access.
# ──────────────────────────────────────────────────────────────────────────────

jobs:
  ci:
    name: Lint, Typecheck & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install

      - name: Generate Convex types
        run: bunx convex codegen
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}

      - name: Lint
        run: bun run lint

      - name: Type check
        run: bun run typecheck

      - name: Unit tests
        run: bun run test:unit

      - name: Integration tests
        run: bun run test:integration

      - name: Check changesets
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: |
          npx changeset status --since=origin/main || echo "::warning::No changeset found. If this PR includes user-facing changes, run 'bun run changeset' to add one."

  release:
    name: Release
    if: >-
      (github.ref == 'refs/heads/main' && github.event_name == 'push') ||
      (github.event_name == 'workflow_dispatch' && inputs.run_release)
    needs: [ci]
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install

      - name: Create Release Pull Request or Tag
        id: changesets
        uses: changesets/action@v1
        with:
          version: bun run changeset:version
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Get current version
        if: steps.changesets.outputs.hasChangesets == 'false'
        id: pkg-version
        run: echo "value=$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"

      - name: Check if tag exists
        if: steps.changesets.outputs.hasChangesets == 'false'
        id: tag-check
        run: |
          if git rev-parse "v${{ steps.pkg-version.outputs.value }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create git tag and GitHub release
        if: steps.changesets.outputs.hasChangesets == 'false' && steps.tag-check.outputs.exists == 'false'
        run: |
          VERSION="v${{ steps.pkg-version.outputs.value }}"
          git tag "$VERSION"
          git push origin "$VERSION"
          gh release create "$VERSION" --generate-notes --title "$VERSION"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
