name: Preview Cleanup

on:
  pull_request:
    types: [closed]

jobs:
  cleanup-preview:
    name: Clean Up Preview
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Delete Convex Preview
        continue-on-error: true
        run: |
          PR_NUMBER=${{ github.event.pull_request.number }}
          echo "Cleaning up Convex preview instance: pr-${PR_NUMBER}"
          npx convex deploy --preview "pr-${PR_NUMBER}" --preview-remove 2>&1 || echo "::warning::Could not remove Convex preview pr-${PR_NUMBER}. It may expire automatically."
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}

      - name: Comment PR cleanup status
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.issue.number;
            const merged = context.payload.pull_request.merged;
            const status = merged ? 'merged' : 'closed';

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });

            const botComment = comments.find(
              (c) => c.user.type === 'Bot' && c.body.includes('## Preview Deployment')
            );

            if (botComment) {
              const body = [
                '## Preview Deployment',
                '',
                `~~Preview deployments have been cleaned up~~ (PR ${status})`,
              ].join('\n');

              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body,
              });
            }
