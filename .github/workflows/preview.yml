name: Preview Deployment

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  deploy-preview:
    name: Deploy Preview
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install

      - name: Deploy Convex Preview
        id: convex-preview
        run: |
          PR_NUMBER=${{ github.event.pull_request.number }}
          OUTPUT=$(npx convex deploy --preview "pr-${PR_NUMBER}" 2>&1) || true
          echo "$OUTPUT"
          CONVEX_URL=$(echo "$OUTPUT" | grep -oE 'https://[^ ]+\.convex\.(cloud|site)' | head -1)
          if [ -z "$CONVEX_URL" ]; then
            CONVEX_URL="See Convex dashboard for preview pr-${PR_NUMBER}"
          fi
          echo "url=${CONVEX_URL}" >> "$GITHUB_OUTPUT"
          echo "name=pr-${PR_NUMBER}" >> "$GITHUB_OUTPUT"
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_PREVIEW_DEPLOY_KEY }}

      - name: Pull Vercel Project Settings
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build Vercel Preview
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          NEXT_PUBLIC_CONVEX_URL: ${{ steps.convex-preview.outputs.url }}
          NEXT_PUBLIC_CONVEX_SITE_URL: ${{ steps.convex-preview.outputs.url }}

      - name: Deploy Vercel Preview
        id: vercel-preview
        run: |
          DEPLOYMENT_URL=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=${DEPLOYMENT_URL}" >> "$GITHUB_OUTPUT"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Comment PR with Preview URLs
        uses: actions/github-script@v7
        with:
          script: |
            const vercelUrl = '${{ steps.vercel-preview.outputs.url }}';
            const convexUrl = '${{ steps.convex-preview.outputs.url }}';
            const prNumber = context.issue.number;

            const body = [
              '## Preview Deployment',
              '',
              '| Service | URL |',
              '|---------|-----|',
              `| Vercel | ${vercelUrl} |`,
              `| Convex | ${convexUrl} |`,
              '',
              `_Deployed from commit ${context.sha.substring(0, 7)}_`,
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });

            const botComment = comments.find(
              (c) => c.user.type === 'Bot' && c.body.includes('## Preview Deployment')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              });
            }
