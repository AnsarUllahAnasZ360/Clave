name: Preview Deploy

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# ─── Secrets required ─────────────────────────────────────────────────────────
# CONVEX_DEPLOY_KEY_PREVIEW — project-scoped Convex preview deploy key
#                             format: preview:<team>:<project>|<base64>
#                             Convex auto-names the preview after the branch
#                             using GITHUB_HEAD_REF from GitHub Actions env.
# VERCEL_TOKEN              — Vercel access token (account/tokens in Vercel dashboard)
#
# .vercel/project.json is committed — no VERCEL_ORG_ID / VERCEL_PROJECT_ID needed.
# ──────────────────────────────────────────────────────────────────────────────

permissions:
  contents: read
  pull-requests: write

jobs:
  deploy:
    name: Deploy Preview
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=preview
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      # vercel build runs the vercel.json buildCommand which calls:
      #   npx convex deploy --cmd-url-env-var-name NEXT_PUBLIC_CONVEX_URL --cmd 'next build'
      # With a preview-scoped CONVEX_DEPLOY_KEY, Convex auto-creates a preview
      # deployment named after the branch (reads GITHUB_HEAD_REF from env).
      - name: Build (Convex preview + Next.js)
        run: vercel build --yes
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY_PREVIEW }}

      - name: Deploy to Vercel (Preview)
        id: deploy
        run: |
          URL=$(vercel deploy --prebuilt)
          echo "url=$URL" >> "$GITHUB_OUTPUT"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Comment preview URL on PR
        uses: actions/github-script@v7
        with:
          script: |
            const url = '${{ steps.deploy.outputs.url }}';
            const marker = '<!-- clave-preview-deploy -->';
            const body = `${marker}\n🚀 **Preview deployed:** ${url}\n\n_Last updated: ${new Date().toUTCString()}_`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c => c.body && c.body.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
